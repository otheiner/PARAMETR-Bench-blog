---
layout: base
---
    
<!-- Lightbox image display-->   
<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/lightbox-2.6.min.js' | relative_url }}"></script>
<link href="{{ '/assets/css/lightbox.css' | relative_url }}" rel="stylesheet" media="screen"/>

<!-- Justified image galleries--> 
<link rel="stylesheet" href="{{ '/assets/css/justifiedGallery.min.css' | relative_url }}">
<script src="{{ '/assets/js/jquery.justifiedGallery.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/gallery.js' | relative_url }}"></script>

<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    {%- if page.image_heading -%}
      <img src="{{- page.image_heading | relative_url -}}" alt="" class="featured-image-post">
    {%- endif -%}
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title |  markdownify | remove: '<p>' | remove: '</p>' }}</h1>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('pre > code.language-mermaid').forEach(function(block) {
        var pre = block.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent;
        pre.parentElement.replaceChild(div, pre);
      });
      mermaid.run();
    });
  </script>
</article>
